# =============================================================================
# CampusPilot AI — Nginx Reverse Proxy Configuration (API Gateway)
# Designed for AWS EC2 Backend Hosting (FastAPI + Gemini SSE AI Streaming)
# (Next.js Frontend is hosted separately on Vercel)
# =============================================================================

upstream backend_upstream {
    server backend:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Maximum request body size for PDF document uploads (15MB covers 10MB file + multipart overhead)
    client_max_body_size 15M;

    # Production Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # ACME Challenge endpoint for Let's Encrypt / Certbot SSL certificate renewal
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    # 1. API Reverse Proxy (FastAPI endpoints under /api/)
    location /api/ {
        proxy_pass http://backend_upstream/api/;
        proxy_http_version 1.1;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Critical Server-Sent Events (SSE) streaming optimizations for Gemini AI responses
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    # 2. System Health Check Endpoint
    location /health {
        proxy_pass http://backend_upstream/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # 3. Root and documentation endpoints (proxied to FastAPI root)
    location / {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }
}

